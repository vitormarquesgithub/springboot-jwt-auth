spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jwt_auth_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: mySecretKeyForHS256ThatIsAtLeast32CharactersLong
  expiration: 86400000      # 24h
  refresh-expiration: 604800000  # 7d