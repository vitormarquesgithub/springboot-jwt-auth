spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/jwt_auth_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: postgres
    password: postgres
    url: jdbc:postgresql://postgres-db:5432/jwt_auth_db

jwt:
  secret: ${JWT_SECRET:mySecretKeyForHS256ThatIsAtLeast32CharactersLong}
  expiration: 86400000
  refresh-expiration: 604800000