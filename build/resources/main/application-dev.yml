spring:
  config:
    import: optional:file:docker/.env   
  datasource:
    url: jdbc:postgresql://localhost:5432/jwt_auth_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:mySecretKeyForHS256ThatIsAtLeast32CharactersLong}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  security:
    immediate-revocation: ${IMMEDIATE_REVOCATION:true}
  admin:
    password: ${APP_ADMIN_PASSWORD:}